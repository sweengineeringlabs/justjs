name: CI

# What this covers (justjs#76): typecheck/build/test across every
# workspace package, plus justjs#40's vendor-external integration test
# (proves the tarballs scm/vendor-external.sh produces genuinely install
# and execute via plain `npm install`, not just that the script exits 0).
#
# What this does NOT cover: anything requiring a physical Android device -
# installing/launching an APK, chromiumctl-cli/adb-driven behavioral
# verification (CSS/state-setter/reactive-re-render/biometric/camera
# checks), or release-signed build verification. Those stay manual,
# following docs/6-deployment/playbook.md and docs/6-deployment/
# release-signing.md - see js-runtime's own CI workflow for the
# compile-only Android checks that ARE automatable without a device.
# Regeneration uses the JUSTWEB_READ_TOKEN Actions secret to read the pinned
# private JustWeb source repository.

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require JustWeb read token
        env:
          JUSTWEB_READ_TOKEN: ${{ secrets.JUSTWEB_READ_TOKEN }}
        run: test -n "$JUSTWEB_READ_TOKEN" || { echo "Add the JUSTWEB_READ_TOKEN Actions secret with read access to sweengineeringlabs/justweb."; exit 1; }

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install

      # build before typecheck/test: several packages resolve sibling
      # @justjs/* imports through each other's built dist/*.d.ts (not
      # source-level project references), and package.json's own
      # build/typecheck scripts are already split into explicit
      # dependency-ordered phases for exactly this reason - see the
      # _comment_build_order note there.
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Check out pinned JustWeb source
        uses: actions/checkout@v4
        with:
          repository: sweengineeringlabs/justweb
          ref: 64eb51bf4d471261053f6d08dac6db5ce613abd8
          path: tools/justweb
          token: ${{ secrets.JUSTWEB_READ_TOKEN }}
          persist-credentials: false

      - name: Install pinned JustWeb generator
        uses: dtolnay/rust-toolchain@stable

      - name: Regenerate every JustWeb example
        run: |
          cargo install --path tools/justweb/scm/cli --locked --bin justw swe-justweb-cli
          for app in hello-justjs cross-target-demo agentic-memory-demo ai-code-editor; do
            (cd "scm/examples/$app" && justw generate app)
          done
          if [ -n "$(git status --porcelain -- scm/examples/hello-justjs scm/examples/cross-target-demo scm/examples/agentic-memory-demo scm/examples/ai-code-editor)" ]; then
            git status --short -- scm/examples/hello-justjs scm/examples/cross-target-demo scm/examples/agentic-memory-demo scm/examples/ai-code-editor
            exit 1
          fi

      - name: Verify checked-in JustWeb artifacts
        run: bun run check:justweb-artifacts

      - name: Build every JustWeb example
        run: |
          bun run --filter 'hello-justjs' build
          bun run --filter 'cross-target-demo' build
          bun run --filter 'agentic-memory-demo' build
          bun run --filter 'ai-code-editor' build

      - name: Verify JustWeb example browser flows
        run: |
          for app in hello-justjs cross-target-demo agentic-memory-demo; do
            (cd "scm/examples/$app" && bun verify_web.mjs)
          done
          (cd scm/examples/ai-code-editor && bun verify_mounts.mjs)

      - name: Test
        run: bun run test

      - name: Test external consumption (vendor-external.sh)
        run: bun run test:vendor-external
