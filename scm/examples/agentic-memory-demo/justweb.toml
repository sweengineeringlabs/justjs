name = "agentic-memory-demo"
version = "0.1.0"

# Bun bundles the authored HTML, scripts, and styles for the JustJS CLI.
[build]
entry = "index.html"
outdir = "dist-cli"

[serve]
root = "dist-cli"
port = 3202

[layout]
preset = "by-feature"

[generate]
emit_tests = false

[mounts.chat]
selector = "#mount-chat"
component = "chat"
tag = "x-chat"

[mounts.dashboard]
selector = "#mount-dashboard"
component = "dashboard"
tag = "x-dashboard"

[mounts.curation]
selector = "#mount-curation"
component = "curation"
tag = "x-curation"
