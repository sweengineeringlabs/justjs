name = "cross-target-demo"
version = "0.1.0"

# Bun bundles the authored HTML, scripts, and styles for the JustJS CLI.
[build]
entry = "index.html"
outdir = "dist-cli"

[serve]
root = "dist-cli"
port = 3200

[layout]
preset = "by-feature"

[generate]
emit_tests = false

[mounts.counter]
selector = "#mount-counter"
component = "counter"
tag = "x-counter"

[mounts.fetch]
selector = "#mount-fetch"
component = "fetch"
tag = "x-fetch"

[mounts.login]
selector = "#mount-login"
component = "login"
tag = "x-login"
