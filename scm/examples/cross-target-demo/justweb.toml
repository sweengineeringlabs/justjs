name = "cross-target-demo"
version = "0.1.0"

[layout]
preset = "by-feature"

[generate]
emit_tests = false

[mounts.counter]
selector = "#mount-counter"
component = "counter"
tag = "x-counter"

[mounts.fetch]
selector = "#mount-fetch"
component = "fetch"
tag = "x-fetch"

[mounts.login]
selector = "#mount-login"
component = "login"
tag = "x-login"
