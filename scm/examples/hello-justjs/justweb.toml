name = "hello-justjs"
version = "0.1.0"

# Bun bundles the authored HTML, scripts, and styles for the JustJS CLI.
[build]
entry = "index.html"
outdir = "dist-cli"

[serve]
root = "dist-cli"
port = 3000

[layout]
preset = "by-feature"

[generate]
emit_tests = false

[mounts.counter]
selector = "#counter-page"
component = "counter"
tag = "x-counter"

[mounts.fetch]
selector = "#fetch-page"
component = "fetch-demo"
tag = "x-fetch"

[mounts.form]
selector = "#form-page"
component = "form-demo"
tag = "x-form"
