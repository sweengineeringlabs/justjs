# rustflags: without a larger reserved stack, `.wasm_route(...).build()`
# overflows Windows' default 1MiB main-thread stack while
# WasmtimeComponentEngine loads/validates this package's Wasm component --
# confirmed live: crashed with STATUS_STACK_OVERFLOW at exactly this call
# without this flag, ran clean with it, in an otherwise-identical build.
# Doesn't reproduce building the same handler from inside edge-bootstrap's
# own workspace (different linker defaults there) -- if edge-bootstrap ever
# bumps its own linked stack reserve for `wasm`-feature binaries, this can
# be dropped along with it.
#
# rustc-wrapper: matches edge-bootstrap/scm/.cargo/config.toml's own
# override -- disables the machine-global sccache wrapper, which that
# repo's own config documents as broken with this nightly toolchain's long
# command lines on Windows.
[build]
rustc-wrapper = ""
rustflags = ["-C", "link-args=/STACK:16777216"]
