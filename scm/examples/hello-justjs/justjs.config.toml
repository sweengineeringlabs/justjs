[app]
name = "hello-justjs"
version = "0.1.0"

# DDAS validation is mandatory at boot; no enforcement toggle is supported.

[security]
strategy = "noop"

# Only "noop" strategies are self-registered by the aop/* workspaces today
# (see aop/*/scm/main/src/spi/index.ts) - "console"/"light" etc. do not exist
# as importable strategy packages yet, so this demo can only request "noop".
[observability]
strategy = "noop"

[i18n]
strategy = "noop"

[flags]
strategy = "noop"

[analytics]
strategy = "noop"

[theming]
strategy = "noop"

[routes]
"/counter" = "counter"
"/fetch" = "fetch-demo"
"/form" = "form-demo"

[components]
"x-counter" = "counter"
"x-fetch" = "fetch-demo"
"x-form" = "form-demo"

[registry]
domAddressMap = {
  "x-counter" = "#app",
  "x-fetch" = "#app",
  "x-form" = "#app"
}

[justweb]
generator_version = "0.1.0"
generator_revision = "64eb51bf4d471261053f6d08dac6db5ce613abd8"
artifact_schema = 1
artifact_manifest = "public/justweb-artifacts.gen.json"
